spring:
  application:
    name: notification-at-scale
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import: optional:file:.env[.properties]

  jackson:
    time-zone: UTC
  mvc:
    problemdetails:
      enabled: true
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  datasource:
    hikari:
      pool-name: notification-pool
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1800000

server:
  port: ${APP_PORT:8080}

logging:
  level:
    root: INFO
    com.rbouaro: INFO
